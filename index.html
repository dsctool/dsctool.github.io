<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowTools - Discord Arsenal</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>
  
  <div class="container">
    <header>
      <h1 class="glitch" data-text="SHADOWTOOLS">SHADOWTOOLS</h1>
      <p class="subtitle">Discord Arsenal v2.0</p>
    </header>

    <nav class="tool-nav">
      <button class="nav-btn active" data-tool="spammer">📨 Mass DM</button>
      <button class="nav-btn" data-tool="raider">⚔️ Raider</button>
      <button class="nav-btn" data-tool="webhook">🔗 Webhook</button>
      <button class="nav-btn" data-tool="checker">🔍 Token Check</button>
      <button class="nav-btn" data-tool="reaction">👍 Reaction</button>
      <button class="nav-btn" data-tool="nuker">💣 Nuker</button>
      <button class="nav-btn" data-tool="friend">👥 Friend Req</button>
      <button class="nav-btn" data-tool="nickname">🏷️ Nickname</button>
      <button class="nav-btn" data-tool="roles">🎭 Mass Roles</button>
    </nav>

    <!-- Mass DM Spammer -->
    <div class="tool-panel active" id="spammer-panel">
      <h2>Mass DM Spammer</h2>
      <div class="input-group">
        <label>Tokens (1行につき1つ)</label>
        <textarea id="dmTokens" placeholder="MTE5xxxxxxxxxxxxxxxx&#10;MTE5xxxxxxxxxxxxxxxx" rows="4"></textarea>
      </div>
      <div class="input-group">
        <label>Target User IDs</label>
        <textarea id="dmTargets" placeholder="1234567890123456789&#10;9876543210987654321" rows="3"></textarea>
      </div>
      <div class="input-group">
        <label>Message</label>
        <textarea id="dmMessage" placeholder="Your message here..." rows="3"></textarea>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Count</label>
          <input type="number" id="dmCount" value="10" min="1">
        </div>
        <div class="input-group half">
          <label>Delay (ms)</label>
          <input type="number" id="dmDelay" value="1000" min="0">
        </div>
      </div>
      <div class="btn-group">
        <button id="startDmBtn" class="btn-primary">🚀 開始</button>
        <button id="stopDmBtn" class="btn-danger">🛑 停止</button>
      </div>
      <div class="log-box" id="dmLog"></div>
    </div>

    <!-- Raider -->
    <div class="tool-panel" id="raider-panel">
      <h2>Server Raider</h2>
      <div class="input-group">
        <label>Tokens</label>
        <textarea id="raidTokens" placeholder="Tokens here..." rows="4"></textarea>
      </div>
      <div class="input-group">
        <label>Guild ID</label>
        <input type="text" id="raidGuild" placeholder="1234567890123456789">
      </div>
      <div class="input-group">
        <label>Channel ID</label>
        <input type="text" id="raidChannel" placeholder="9876543210987654321">
      </div>
      <div class="input-group">
        <label>Message Content</label>
        <textarea id="raidMessage" placeholder="@everyone RAID!" rows="2"></textarea>
      </div>
      <div class="options-grid">
        <label class="checkbox"><input type="checkbox" id="raidMention"> @everyone</label>
        <label class="checkbox"><input type="checkbox" id="raidPing"> Mass Ping</label>
        <label class="checkbox"><input type="checkbox" id="raidTts"> TTS</label>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Threads</label>
          <input type="number" id="raidThreads" value="5" min="1" max="20">
        </div>
        <div class="input-group half">
          <label>Delay</label>
          <input type="number" id="raidDelay" value="500" min="0">
        </div>
      </div>
      <div class="btn-group">
        <button id="startRaidBtn" class="btn-primary">⚔️ RAID開始</button>
        <button id="stopRaidBtn" class="btn-danger">🛑 停止</button>
        <button id="leaveGuildBtn" class="btn-secondary">🚪 脱退</button>
      </div>
      <div class="log-box" id="raidLog"></div>
    </div>

    <!-- Webhook Spammer -->
    <div class="tool-panel" id="webhook-panel">
      <h2>Webhook Spammer</h2>
      <div class="input-group">
        <label>Webhook URLs (1行につき1つ)</label>
        <textarea id="webhookUrls" placeholder="https://discord.com/api/webhooks/...&#10;https://discord.com/api/webhooks/..." rows="4"></textarea>
      </div>
      <div class="input-group">
        <label>Message / Embed JSON</label>
        <textarea id="webhookMessage" placeholder="Message or embed JSON..." rows="4"></textarea>
      </div>
      <div class="input-group">
        <label>Username Override</label>
        <input type="text" id="webhookName" placeholder="Webhook Name">
      </div>
      <div class="input-group">
        <label>Avatar URL</label>
        <input type="text" id="webhookAvatar" placeholder="https://...">
      </div>
      <div class="options-grid">
        <label class="checkbox"><input type="checkbox" id="webhookEmbed"> Use Embed</label>
        <label class="checkbox"><input type="checkbox" id="webhookDelete"> Auto Delete</label>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Count</label>
          <input type="number" id="webhookCount" value="50" min="1">
        </div>
        <div class="input-group half">
          <label>Delay (ms)</label>
          <input type="number" id="webhookDelay" value="100" min="0">
        </div>
      </div>
      <div class="btn-group">
        <button id="startWebhookBtn" class="btn-primary">🔗 開始</button>
        <button id="stopWebhookBtn" class="btn-danger">🛑 停止</button>
        <button id="deleteWebhookBtn" class="btn-warning">🗑️ 削除</button>
      </div>
      <div class="log-box" id="webhookLog"></div>
    </div>

    <!-- Token Checker -->
    <div class="tool-panel" id="checker-panel">
      <h2>Token Checker</h2>
      <div class="input-group">
        <label>Tokens (1行につき1つ)</label>
        <textarea id="checkTokens" placeholder="Paste tokens here..." rows="6"></textarea>
      </div>
      <div class="btn-group">
        <button id="checkTokenBtn" class="btn-primary">🔍 検証開始</button>
        <button id="exportValidBtn" class="btn-secondary">💾 有効トークン保存</button>
      </div>
      <div class="stats-box" id="checkStats">
        <span>Valid: <b id="validCount">0</b></span>
        <span>Invalid: <b id="invalidCount">0</b></span>
        <span>Locked: <b id="lockedCount">0</b></span>
      </div>
      <div class="log-box" id="checkLog"></div>
    </div>

    <!-- Reaction Spammer -->
    <div class="tool-panel" id="reaction-panel">
      <h2>Reaction Spammer</h2>
      <div class="input-group">
        <label>Tokens</label>
        <textarea id="reactTokens" placeholder="Tokens..." rows="4"></textarea>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Channel ID</label>
          <input type="text" id="reactChannel" placeholder="Channel ID">
        </div>
        <div class="input-group half">
          <label>Message ID</label>
          <input type="text" id="reactMessage" placeholder="Message ID">
        </div>
      </div>
      <div class="input-group">
        <label>Emojis (1行につき1つ)</label>
        <textarea id="reactEmojis" placeholder="😀&#10;🔥&#10;custom:emoji_id" rows="3"></textarea>
      </div>
      <div class="btn-group">
        <button id="startReactBtn" class="btn-primary">👍 リアクション開始</button>
        <button id="stopReactBtn" class="btn-danger">🛑 停止</button>
      </div>
      <div class="log-box" id="reactLog"></div>
    </div>

    <!-- Server Nuker -->
    <div class="tool-panel" id="nuker-panel">
      <h2>Server Nuker</h2>
      <div class="input-group">
        <label>Bot Token (Admin権限必須)</label>
        <input type="text" id="nukeToken" placeholder="Bot Token">
      </div>
      <div class="input-group">
        <label>Guild ID</label>
        <input type="text" id="nukeGuild" placeholder="Guild ID">
      </div>
      <div class="nuke-options">
        <h3>破壊オプション</h3>
        <label class="checkbox"><input type="checkbox" id="nukeChannels"> 全チャンネル削除</label>
        <label class="checkbox"><input type="checkbox" id="nukeRoles"> 全ロール削除</label>
        <label class="checkbox"><input type="checkbox" id="nukeEmojis"> 全絵文字削除</label>
        <label class="checkbox"><input type="checkbox" id="nukeInvites"> 全招待無効化</label>
        <label class="checkbox"><input type="checkbox" id="nukeBan"> 全メンバーをBAN</label>
        <label class="checkbox"><input type="checkbox" id="nukeKick"> 全メンバーをKICK</label>
      </div>
      <div class="input-group">
        <label>新しいサーバー名</label>
        <input type="text" id="nukeName" placeholder="Nuked by ShadowTools">
      </div>
      <div class="btn-group">
        <button id="startNukeBtn" class="btn-danger">💣 NUKE実行</button>
      </div>
      <div class="log-box" id="nukeLog"></div>
    </div>

    <!-- Friend Request Spammer -->
    <div class="tool-panel" id="friend-panel">
      <h2>Friend Request Spammer</h2>
      <div class="input-group">
        <label>Tokens</label>
        <textarea id="friendTokens" placeholder="Tokens..." rows="4"></textarea>
      </div>
      <div class="input-group">
        <label>Target Usernames (name#tag)</label>
        <textarea id="friendTargets" placeholder="user#1234&#10;test#5678" rows="4"></textarea>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Delay (ms)</label>
          <input type="number" id="friendDelay" value="2000" min="500">
        </div>
      </div>
      <div class="btn-group">
        <button id="startFriendBtn" class="btn-primary">👥 フレンド申請開始</button>
        <button id="stopFriendBtn" class="btn-danger">🛑 停止</button>
      </div>
      <div class="log-box" id="friendLog"></div>
    </div>

    <!-- Nickname Changer -->
    <div class="tool-panel" id="nickname-panel">
      <h2>Nickname Changer</h2>
      <div class="input-group">
        <label>Bot Token</label>
        <input type="text" id="nickToken" placeholder="Bot Token">
      </div>
      <div class="input-group">
        <label>Guild ID</label>
        <input type="text" id="nickGuild" placeholder="Guild ID">
      </div>
      <div class="input-group">
        <label>New Nickname</label>
        <input type="text" id="nickName" placeholder="New Nickname">
      </div>
      <div class="options-grid">
        <label class="checkbox"><input type="checkbox" id="nickRandom"> ランダム文字列追加</label>
        <label class="checkbox"><input type="checkbox" id="nickMe"> 自分のみ変更</label>
      </div>
      <div class="btn-group">
        <button id="startNickBtn" class="btn-primary">🏷️ 変更実行</button>
      </div>
      <div class="log-box" id="nickLog"></div>
    </div>

    <!-- Mass Role Creator -->
    <div class="tool-panel" id="roles-panel">
      <h2>Mass Role Creator</h2>
      <div class="input-group">
        <label>Bot Token</label>
        <input type="text" id="roleToken" placeholder="Bot Token">
      </div>
      <div class="input-group">
        <label>Guild ID</label>
        <input type="text" id="roleGuild" placeholder="Guild ID">
      </div>
      <div class="input-group">
        <label>Role Names (1行につき1つ)</label>
        <textarea id="roleNames" placeholder="Role1&#10;Role2&#10;Role3" rows="5"></textarea>
      </div>
      <div class="input-group">
        <label>Role Color (Hex)</label>
        <input type="text" id="roleColor" placeholder="#FF0000" value="#FF0000">
      </div>
      <div class="options-grid">
        <label class="checkbox"><input type="checkbox" id="roleHoist"> 別途表示</label>
        <label class="checkbox"><input type="checkbox" id="roleMention"> メンション許可</label>
      </div>
      <div class="input-row">
        <div class="input-group half">
          <label>Count per Name</label>
          <input type="number" id="roleCount" value="10" min="1">
        </div>
        <div class="input-group half">
          <label>Delay (ms)</label>
          <input type="number" id="roleDelay" value="500" min="0">
        </div>
      </div>
      <div class="btn-group">
        <button id="startRoleBtn" class="btn-primary">🎭 ロール作成開始</button>
        <button id="stopRoleBtn" class="btn-danger">🛑 停止</button>
      </div>
      <div class="log-box" id="roleLog"></div>
    </div>

    <footer>
      <p>ShadowTools v2.0 | Use at your own risk</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
